<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee5">
  <meta name="description" content="Convite digital interativo">
  <title>Nosso Casamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --gold:#ae7b38;
      --paper:#f4eee5;
      --w:853;
      --h:1844;
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--paper);
    }

    body{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }

    .invitation{
      position:relative;
      container-type:inline-size;
      height:100dvh;
      width:min(100vw, calc(100dvh * 853 / 1844));
      aspect-ratio:853/1844;
      overflow:hidden;
      isolation:isolate;
      background-image:url("assets/envelope-clean.png");
      background-position:center;
      background-size:100% 100%;
      background-repeat:no-repeat;
      box-shadow:0 0 35px rgba(80,55,25,.10);
    }

    .editable{
      position:absolute;
      z-index:5;
      margin:0;
      padding:0;
      color:var(--gold);
      text-align:center;
      outline:none;
      cursor:text;
      user-select:text;
      -webkit-user-select:text;
      white-space:nowrap;
      line-height:1;
      min-width:1px;
    }

    .editable:focus{
      outline:1px dashed rgba(174,123,56,.35);
      outline-offset:3px;
      border-radius:4px;
    }

    .initial{
      font-family:"Alex Brush",cursive;
      font-size:clamp(58px, 12.65cqw, 108px);
      line-height:.78;
      letter-spacing:-.04em;
    }

    .amp{
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(26px, 5.28cqw, 45px);
      line-height:1;
      font-weight:500;
    }

    .small-serif{
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(14px, 2.70cqw, 23px);
      letter-spacing:.045em;
      font-weight:500;
    }

    .names{
      font-family:"Alex Brush",cursive;
      font-size:clamp(32px, 6.68cqw, 57px);
      line-height:.95;
    }

    /* Coordinates are proportional to the original 853 × 1844 artwork. */
    #initial-f{left:36.5%; top:22.55%; width:12.8%;}
    #initial-m{left:45.0%; top:31.05%; width:22.0%;}
    #amp{left:46.0%; top:25.65%; width:8.0%;}
    #title{left:31.5%; top:41.55%; width:37.0%;}
    #closing{left:38.5%; top:76.65%; width:24.0%;}
    #names{left:25.5%; top:79.15%; width:49.0%;}

    .seal-link{
      position:absolute;
      z-index:10;
      left:33.2%;
      top:52.4%;
      width:34.0%;
      height:18.6%;
      border-radius:48%;
      cursor:pointer;
      display:block;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
    }

    .seal-link:focus-visible{
      outline:2px solid rgba(174,123,56,.7);
      outline-offset:4px;
    }

    .seal-arrow{
      position:absolute;
      z-index:12;
      left:61.5%;
      top:66.2%;
      width:11%;
      height:7%;
      pointer-events:none;
      transform:rotate(35deg);
      animation:sealArrow 1.45s ease-in-out infinite;
      transform-origin:20% 50%;
    }

    .seal-arrow::before{
      content:"";
      position:absolute;
      left:18%;
      top:50%;
      width:70%;
      height:2px;
      border-radius:2px;
      background:rgba(174,123,56,.9);
    }

    .seal-arrow::after{
      content:"";
      position:absolute;
      left:7%;
      top:calc(50% - 5px);
      width:10px;
      height:10px;
      border-left:2px solid rgba(174,123,56,.9);
      border-bottom:2px solid rgba(174,123,56,.9);
      transform:rotate(45deg);
    }

    @keyframes sealArrow{
      0%,100%{transform:rotate(35deg) translate(0,0); opacity:.55;}
      50%{transform:rotate(35deg) translate(-5px,-5px); opacity:1;}
    }

    .hint{
      position:fixed;
      left:50%;
      bottom:max(10px, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:30;
      padding:6px 11px;
      border-radius:999px;
      font:12px/1.2 "Cormorant Garamond",serif;
      letter-spacing:.03em;
      color:#8f6938;
      background:rgba(255,250,242,.78);
      box-shadow:0 3px 15px rgba(70,45,20,.08);
      opacity:0;
      pointer-events:none;
      transition:opacity .35s ease;
    }

    body.show-hint .hint{opacity:1}

    @media (min-width:700px){
      .invitation{box-shadow:0 0 45px rgba(60,40,20,.16)}
    }

    @media (max-height:650px) and (orientation:landscape){
      .invitation{
        width:calc(100dvh * 853 / 1844);
        height:100dvh;
      }
    }
  </style>
</head>
<body>
  <main class="invitation" aria-label="Convite de casamento">
    <div id="initial-f" class="editable initial" contenteditable="true" spellcheck="false" data-key="initialF">F</div>
    <div id="amp" class="editable amp" contenteditable="true" spellcheck="false" data-key="amp">&amp;</div>
    <div id="initial-m" class="editable initial" contenteditable="true" spellcheck="false" data-key="initialM">M</div>

    <div id="title" class="editable small-serif" contenteditable="true" spellcheck="false" data-key="title">NOSSO CASAMENTO</div>

    <div id="closing" class="editable small-serif" contenteditable="true" spellcheck="false" data-key="closing">COM AMOR,</div>
    <div id="names" class="editable names" contenteditable="true" spellcheck="false" data-key="names">Gavela &amp; Murilo</div>

    <a class="seal-link"
       href="https://convitedigital.com"
       target="_self"
       aria-label="Abrir site do convite"
       title="Abrir convite">
    </a>
    <span class="seal-arrow" aria-hidden="true"></span>
  </main>

  <div class="hint" id="hint">Toque nos textos para editar</div>

  <script>
    (() => {
      const fields = document.querySelectorAll('.editable');
      const KEY = 'convite-casamento-editavel-v1';

      function save(){
        const data = {};
        fields.forEach(el => data[el.dataset.key] = el.innerText);
        localStorage.setItem(KEY, JSON.stringify(data));
      }

      function load(){
        try{
          const data = JSON.parse(localStorage.getItem(KEY) || 'null');
          if(!data) return;
          fields.forEach(el => {
            if(Object.prototype.hasOwnProperty.call(data, el.dataset.key)){
              el.innerText = data[el.dataset.key];
            }
          });
        }catch(e){}
      }

      fields.forEach(el => {
        el.addEventListener('input', save);
        el.addEventListener('focus', () => document.body.classList.remove('show-hint'));
      });

      load();

      // The hint appears only on the first visit, then disappears.
      if(!localStorage.getItem('convite-hint-seen')){
        document.body.classList.add('show-hint');
        setTimeout(() => {
          document.body.classList.remove('show-hint');
          localStorage.setItem('convite-hint-seen','1');
        }, 4200);
      }
    })();
  </script>
</body>
</html>
